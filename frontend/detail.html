<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Produk - FullSnack</title>
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background-color: #f8f9fa;
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        margin: 50px auto;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
      .back-link {
        text-decoration: none;
        color: #6c757d;
        font-size: 14px;
        margin-bottom: 20px;
        display: inline-block;
      }
      .product-title {
        color: #2c3e50;
        margin-bottom: 10px;
        font-size: 28px;
      }
      .price {
        color: #ff6b9d;
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 15px;
      }
      .description {
        line-height: 1.6;
        color: #34495e;
        background: #fdfdfd;
        padding: 15px;
        border-left: 5px solid #ff6b9d;
      }
      .stock-tag {
        display: inline-block;
        background: #ff6b9d;
        color: #fdfdfd;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 12px;
      }
      .btn-cart {
        margin-top: 20px;
        padding: 10px 20px;
        background: #ff6b9d;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="index.html" class="back-link">Kembali ke Katalog</a>
      <div id="loading">Memuat detail produk...</div>
      <div id="product-detail" style="display: none">
        <h1 id="det-nama" class="product-title"></h1>
        <div id="det-stok" class="stock-tag"></div>
        <p id="det-harga" class="price"></p>
        <div id="det-deskripsi" class="description"></div>
        <button onclick="addToCart()" class="btn-cart">
          Tambah ke Keranjang
        </button>
      </div>
    </div>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get("id");

      async function loadDetail() {
        if (!productId) return;
        try {
          const response = await fetch(
            `http://localhost:3000/api/products/${productId}`,
          );
          const result = await response.json();
          const produk = result.data;
          document.getElementById("det-nama").innerText = produk.nama;
          document.getElementById("det-harga").innerText =
            `Rp ${Number(produk.harga).toLocaleString("id-ID")}`;
          document.getElementById("det-stok").innerText =
            `Stok: ${produk.stok}`;
          document.getElementById("det-deskripsi").innerText =
            produk.deskripsi || "Tidak ada deskripsi.";
          document.getElementById("loading").style.display = "none";
          document.getElementById("product-detail").style.display = "block";
        } catch (error) {
          console.error("Gagal memuat detail:", error);
        }
      }

      async function addToCart() {
        const token = localStorage.getItem("token");
        if (!token) {
          alert("Silakan login terlebih dahulu.");
          return;
        }
        try {
          const response = await fetch("http://localhost:3000/api/cart", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ id_product: productId, quantity: 1 }),
          });
          if (!response.ok) {
            const err = await response.json();
            alert(err.message || "Gagal menambahkan ke keranjang.");
            return;
          }
          alert("Produk berhasil ditambahkan ke keranjang.");
        } catch (error) {
          console.error("Error addToCart:", error);
        }
      }

      loadDetail();
    </script>
  </body>
</html>
